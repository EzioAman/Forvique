packages:
  - .
overrides:
  '@assistant-ui/core': 0.3.33
  assistant-stream: 0.3.56
  assistant-cloud: 0.2.10
  # one copy of each: two copies keep separate state and the app renders blank
  '@assistant-ui/react': 0.15.33
  '@assistant-ui/store': 0.3.23
  '@assistant-ui/tap': 0.9.25
allowBuilds:
  electron: true
  esbuild: true
  # Squirrel installer tooling; Harness ships an NSIS installer instead
  electron-winstaller: false
  # native runtime for on-device embeddings (document search)
  onnxruntime-node: true
  protobufjs: false
minimumReleaseAgeExclude:
  - '@assistant-ui/core@0.3.33'
  - '@assistant-ui/tap@0.9.25'
  - assistant-cloud@0.2.10
  - assistant-stream@0.3.56
  - '@assistant-ui/react-markdown@0.14.25'
  - '@assistant-ui/react@0.15.33'
  - '@assistant-ui/store@0.3.23'
